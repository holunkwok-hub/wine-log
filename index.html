<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wine Log</title>
<meta name="theme-color" content="#6b21a8">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #0f0f0f; --card: #1a1a1a; --accent: #a855f7; --text: #f5f5f5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; font-size: 0.9rem; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  video, canvas, img#preview { width: 100%; border-radius: 12px; background: #000; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #333; color: white; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: white; margin-top: 6px; font-size: 1rem; }
  label { font-size: 0.85rem; color: #ccc; display: block; margin-top: 12px; }
  .status { text-align: center; padding: 10px; border-radius: 10px; margin-top: 10px; display: none; }
  .status.success { background: #166534; display: block; }
  .status.error { background: #991b1b; display: block; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>🍷 Wine Log</h1>
<p class="subtitle">拍照 → AI 分析 → 自動寫入 Notion</p>

<div style="display:flex; gap:8px; margin-bottom:16px;">
  <button class="btn btn-primary" id="tabCapture" style="flex:1;">📸 拍照入庫</button>
  <button class="btn btn-secondary" id="tabLibrary" style="flex:1;">📖 酒庫</button>
</div>

<div class="card" id="cameraSection">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" class="hidden"></canvas>
  <img id="preview" class="hidden">
  <button class="btn btn-primary" id="captureBtn">📸 拍照</button>
  <button class="btn btn-secondary" id="uploadBtn">或選擇相簿</button>
  <input type="file" id="fileInput" accept="image/*" class="hidden">
</div>

<div class="card hidden" id="formSection">
  <img id="photoPreview" style="width:100%;border-radius:12px;margin-bottom:12px;">
  <label>酒名 *</label>
  <input id="name" placeholder="例如：Château Margaux 2015">
  <label>類型</label>
  <select id="type">
    <option>紅酒</option>
    <option>白酒</option>
    <option>粉紅酒</option>
    <option>汽酒</option>
    <option>加強酒</option>
    <option>其他</option>
  </select>
  <label>酒莊</label>
  <input id="winery" placeholder="酒莊名稱">
  <label>年份</label>
  <input id="vintage" type="number" placeholder="2015">
  <label>葡萄品種（用逗號分隔）</label>
  <input id="grapes" placeholder="Cabernet Sauvignon, Merlot">
  <label>大區</label>
  <input id="region" list="regionList" placeholder="例如：Burgundy, Bordeaux">
  <datalist id="regionList">
    <option value="Bordeaux">
    <option value="Burgundy">
    <option value="Champagne">
    <option value="Rhône">
    <option value="Tuscany">
    <option value="Napa Valley">
    <option value="其他">
  </datalist>
  <label>細產區 / 村莊</label>
  <input id="subregion" placeholder="例如：Beaune, Pauillac">
  <label>國家</label>
  <select id="country">
    <option>法國</option>
    <option>義大利</option>
    <option>西班牙</option>
    <option>德國</option>
    <option>澳洲</option>
    <option>美國</option>
    <option>其他</option>
  </select>
  <label>我買的價錢</label>
  <input id="purchasePrice" type="number" placeholder="1200">
  <label>網上價錢</label>
  <input id="onlinePrice" type="number" placeholder="1500">
  <label>個人 Notes</label>
  <textarea id="notes" rows="3" placeholder="你的品酒筆記..."></textarea>
  <button class="btn btn-primary" id="saveBtn">💾 儲存到 Notion</button>
  <button class="btn btn-secondary" id="retakeBtn">重新影相</button>
  <div id="status" class="status"></div>
</div>

<div class="card hidden" id="librarySection">
  <input id="searchInput" placeholder="搜尋酒名、酒莊..." style="margin-bottom:12px;">
  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <select id="filterCountry" style="flex:1;">
      <option value="">所有國家</option>
      <option>法國</option>
      <option>義大利</option>
      <option>西班牙</option>
      <option>德國</option>
      <option>澳洲</option>
      <option>美國</option>
    </select>
    <select id="sortBy" style="flex:1;">
      <option value="date">按飲用時間</option>
      <option value="country">按國家</option>
      <option value="region">按地區</option>
    </select>
  </div>
  <div id="wineList" style="display:grid; gap:12px;"></div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const photoPreview = document.getElementById('photoPreview');
const captureBtn = document.getElementById('captureBtn');
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const cameraSection = document.getElementById('cameraSection');
const formSection = document.getElementById('formSection');
const saveBtn = document.getElementById('saveBtn');
const retakeBtn = document.getElementById('retakeBtn');
const statusEl = document.getElementById('status');

const tabCapture = document.getElementById('tabCapture');
const tabLibrary = document.getElementById('tabLibrary');
const librarySection = document.getElementById('librarySection');
const wineList = document.getElementById('wineList');
const searchInput = document.getElementById('searchInput');
const filterCountry = document.getElementById('filterCountry');
const sortBy = document.getElementById('sortBy');

tabCapture.onclick = () => {
  librarySection.classList.add('hidden');
  cameraSection.classList.remove('hidden');
  formSection.classList.add('hidden');
};

tabLibrary.onclick = () => {
  cameraSection.classList.add('hidden');
  formSection.classList.add('hidden');
  librarySection.classList.remove('hidden');
  loadWines();
};

async function loadWines() {
  wineList.innerHTML = '<p style="text-align:center;color:#aaa;">載入中...</p>';
  const params = new URLSearchParams({
    query: searchInput.value,
    country: filterCountry.value,
    sort: sortBy.value,
  });

  try {
    const res = await fetch('/api/wines?' + params);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    if (data.wines.length === 0) {
      wineList.innerHTML = '<p style="text-align:center;color:#aaa;">未有記錄</p>';
      return;
    }

    wineList.innerHTML = data.wines.map(w => `
      <div style="background:#222;border-radius:12px;padding:12px;">
        <div style="font-weight:600;font-size:1.1rem;">${w.name}</div>
        <div style="color:#aaa;font-size:0.9rem;margin-top:4px;">
          ${w.winery || ''} ${w.vintage || ''} · ${w.country} ${w.region || ''}
        </div>
        <div style="margin-top:6px;font-size:0.85rem;color:#ccc;">
          ${(w.grapes || []).join(', ')} ${w.subregion ? '· ' + w.subregion : ''}
        </div>
        ${w.notes ? `<div style="margin-top:8px;font-size:0.85rem;color:#ddd;">${w.notes}</div>` : ''}
        <a href="${w.url}" target="_blank" style="color:#a855f7;font-size:0.8rem;display:inline-block;margin-top:8px;">在 Notion 開啟 →</a>
      </div>
    `).join('');
  } catch (e) {
    wineList.innerHTML = `<p style="color:#f87171;text-align:center;">載入失敗：${e.message}</p>`;
  }
}

searchInput.oninput = () => loadWines();
filterCountry.onchange = () => loadWines();
sortBy.onchange = () => loadWines();

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    alert('無法開啟相機，請用「選擇相簿」或允許相機權限。');
  }
}

startCamera();

captureBtn.onclick = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  showForm(dataUrl);
};

uploadBtn.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => showForm(reader.result);
  reader.readAsDataURL(file);
};

function showForm(dataUrl) {
  photoPreview.src = dataUrl;
  cameraSection.classList.add('hidden');
  formSection.classList.remove('hidden');
  analyzeWithAI(dataUrl);
}

async function analyzeWithAI(dataUrl) {
  statusEl.className = 'status';
  statusEl.textContent = 'AI 正在分析酒標...';
  statusEl.classList.add('success');
  statusEl.style.display = 'block';

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: dataUrl, analyzeOnly: true }),
    });
    const data = await res.json();

    if (data.success && data.analysis) {
      const a = data.analysis;
      document.getElementById('name').value = a.name || '';
      document.getElementById('type').value = a.type || '其他';
      document.getElementById('winery').value = a.winery || '';
      document.getElementById('vintage').value = a.vintage || '';
      document.getElementById('grapes').value = (a.grapes || []).join(', ');
      document.getElementById('region').value = a.region || '';
      document.getElementById('subregion').value = a.subregion || '';
      document.getElementById('country').value = a.country || '其他';
      if (a.notes) document.getElementById('notes').value = a.notes;
      statusEl.textContent = '分析完成！請檢查並修改後再儲存。';
    } else {
      throw new Error(data.error || '分析失敗');
    }
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = 'AI 分析失敗：' + e.message + '（可手動填寫）';
  }
}

retakeBtn.onclick = () => {
  formSection.classList.add('hidden');
  cameraSection.classList.remove('hidden');
};

saveBtn.onclick = async () => {
  const payload = {
    imageBase64: photoPreview.src,
    name: document.getElementById('name').value,
    type: document.getElementById('type').value,
    winery: document.getElementById('winery').value,
    vintage: document.getElementById('vintage').value,
    grapes: document.getElementById('grapes').value,
    region: document.getElementById('region').value,
    subregion: document.getElementById('subregion').value,
    country: document.getElementById('country').value,
    purchasePrice: document.getElementById('purchasePrice').value,
    onlinePrice: document.getElementById('onlinePrice').value,
    notes: document.getElementById('notes').value,
  };

  statusEl.className = 'status';
  statusEl.textContent = '正在寫入 Notion...';
  statusEl.classList.add('success');
  statusEl.style.display = 'block';

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (data.success) {
      statusEl.textContent = `成功！已寫入 Notion：${data.pageUrl}`;
    } else {
      throw new Error(data.error || '未知錯誤');
    }
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = '失敗：' + e.message;
  }
};
</script>
</body>
</html>
